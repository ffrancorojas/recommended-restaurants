services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: restaurantes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y configura POSTGRES_PASSWORD}
      POSTGRES_DB: restaurantes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurantes -d restaurantes"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
